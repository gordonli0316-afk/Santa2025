<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2025 Cyberpunk Christmas Tree</title>
    <link rel="stylesheet" href="style.css">
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://npm.elemecdn.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://npm.elemecdn.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    
    <script src="https://code.bdstatic.com/npm/leancloud-storage@4.12.0/dist/av-min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div class="ui-container">
        <div class="header">
            <h1>MERRY CHRISTMAS</h1>
            <p>Make a Wish · 共绘星河</p>
        </div>

        <div class="input-wrapper">
            <input type="text" id="wishInput" placeholder="写下愿望，发送弹幕 (所有人可见)..." maxlength="30">
            <button id="sendBtn">发送 ✨</button>
        </div>
        <p class="status-bar" id="statusBar">正在连接许愿池...</p>
    </div>

    <div id="loader">
        <div class="spinner"></div>
        <p>正在点亮圣诞树...</p>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
