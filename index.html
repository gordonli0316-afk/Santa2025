<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Merry Christmas by Gordon</title>
    <link rel="stylesheet" href="style.css">
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script src="https://code.bdstatic.com/npm/leancloud-storage@4.12.0/dist/av-min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div class="ui-container">
        <div class="header">
            <h1>MERRY CHRISTMAS</h1>
            <p>Created by Gordon</p>
        </div>

        <div class="input-wrapper">
            <input type="text" id="wishInput" placeholder="写下愿望..." maxlength="30">
            <button id="sendBtn">发送 ❄️</button>
        </div>
        <p class="status-bar" id="statusBar">正在连接...</p>
    </div>

    <div id="loader">
        <div class="spinner"></div>
        <p id="loading-text">Loading...</p>
    </div>

    <script>
        window.onerror = function(msg, url, line) {
            document.getElementById('loading-text').innerText = "加载出错，请刷新重试";
            document.getElementById('loading-text').style.color = "red";
            console.error("Global Error:", msg);
        };
    </script>

    <script type="module" src="script.js"></script>
</body>
</html>
